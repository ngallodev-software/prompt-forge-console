server {
  listen 80;
  server_name prompt-forge localhost _;

  root /usr/share/nginx/html;
  index index.html;

  location /console/ {
    proxy_pass http://promptforge-api:8090;
  }

  location = /health {
    proxy_pass http://promptforge-api:8090;
  }

  location = /_healthz {
    proxy_pass http://promptforge-api:8090;
  }

  location /providers/ {
    proxy_pass http://promptforge-api:8090;
  }

  location /preprocess {
    proxy_pass http://promptforge-api:8090;
  }

  location /validate {
    proxy_pass http://promptforge-api:8090;
  }

  location /render {
    proxy_pass http://promptforge-api:8090;
  }

  location /prepare-delivery {
    proxy_pass http://promptforge-api:8090;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
